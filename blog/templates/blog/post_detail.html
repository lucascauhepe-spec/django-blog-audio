{% extends "base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
  <article>
    <h1>{{ post.title }}</h1>
    <p class="text-body-secondary">
      by {{ post.author }} · {{ post.created_at|date:"M j, Y" }}
    </p>

    <div class="mt-4">
      {{ post.content|linebreaks }}
    </div>
  </article>

  <a href="{% url 'blog:post_list' %}" class="btn btn-link px-0 mt-3">← Back to all posts</a>
{% endblock %}
