<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ post.title }}</title>
</head>
<body>
  <h1>{{ post.title }}</h1>
  <p>By {{ post.author }} · {{ post.created_at|date:"M j, Y" }}</p>

  {{ post.content|linebreaks }}

  <p><a href="{% url 'blog:post_list' %}">Back to all posts</a></p>
</body>
</html>
