{% extends "base.html" %}

{% block title %}Sign up{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <h1 class="mb-4">Create your account</h1>

      <form method="post" class="django-form">
        {% csrf_token %}
        {{ form }}
        <button type="submit" class="btn btn-primary w-100 mt-2">Sign up</button>
      </form>

      <p class="mt-3 text-center">
        Already have an account? <a href="{% url 'accounts:login' %}">Log in</a>
      </p>
    </div>
  </div>
{% endblock %}
